plugins {
    id 'com.android.library' version '8.11.0'
    id 'com.vanniktech.maven.publish' version '0.34.0'
//    id 'signing'
}

group = "io.github.runalia"
version = "1.0.0"

android {
    namespace 'com.data.hostedpayments'
    compileSdk 36

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            buildConfigField "String", "SDK_VERSION_CODE", '"v3.0.3"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }

        debug {
            buildConfigField "String", "SDK_VERSION_CODE", '"v3.0.3"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

//    publishing {
//        singleVariant("release") {
//            withSourcesJar()
//            withJavadocJar()
//        }
//    }
}

dependencies {

    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation files('libs/commons-codec-1.5.jar')

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'com.google.code.gson:gson:2.8.9'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
mavenPublishing {

    publishToMavenCentral()

    signAllPublications()

    coordinates(
            "io.github.runalia",
            "android-hosted-payments",
            "1.0.0"
    )

    pom {

        name.set("Android Hosted Payments SDK")
        description.set("Android Hosted Payment SDK")
        url.set("https://github.com/runaliA/android-hosted-plugin")

        licenses {
            license {
                name.set("Apache License 2.0")
                url.set("https://www.apache.org/licenses/LICENSE-2.0.txt")
            }
        }

        developers {
            developer {
                id.set("runaliA")
                name.set("Runali Ambavkar")
                email.set("user.mac@concertosoft.com")
            }
        }

        scm {
            connection.set("scm:git:git://github.com/runaliA/android-hosted-plugin.git")
            developerConnection.set("scm:git:ssh://github.com/runaliA/android-hosted-plugin.git")
            url.set("https://github.com/runaliA/android-hosted-plugin")
        }
    }
}
